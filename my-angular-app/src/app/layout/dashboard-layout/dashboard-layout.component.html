<mat-drawer-container class="example-container h-screen">
  <mat-drawer class="h-full min-w-[225px]" #drawer mode="side" opened>
    <div class="flex flex-col py-6 px-4">
      <div class="flex flex-col gap-4">
        <div>
          <h1 class="!m-0 text-center">DARMA Wira</h1>
          <h4 class="text-center !m-0">ADMTC DIR</h4>
        </div>
        <div>
          <div>
            <app-quick-search></app-quick-search>
          </div>
        </div>
      </div>
      <div>
        <nav>
          <ul class="flex flex-col gap-2 mt-4">
            <li class="hover:text-amber-300 hover:bg-[#353535] rounded-lg">
              <a
                [routerLink]="['/rncp-title']"
                class="flex gap-2 items-center px-2 py-4"
                routerLinkActive="class-active-route"
              >
                <mat-icon>home</mat-icon>
                Titles RNCP
              </a>
            </li>
            <li class="hover:text-amber-300 hover:bg-[#353535] rounded-lg">
              <a
                [routerLink]="['/school']"
                class="flex gap-2 items-center px-2 py-4"
                routerLinkActive="class-active-route"
              >
                <mat-icon>home</mat-icon>
                School
              </a>
            </li>
            <li class="hover:text-amber-300 hover:bg-[#353535] rounded-lg">
              <a
                [routerLink]="['/user']"
                class="flex gap-2 items-center px-2 py-4"
                routerLinkActive="class-active-route"
              >
                <mat-icon>person</mat-icon>
                User
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </mat-drawer>
  <mat-drawer-content class="bg-[#363636] mb-6">
    <div class="h-[75px] w-full flex px-6">
      <div class="flex w-full justify-between">
        <div class="flex items-center gap-4">
          <button
            mat-mini-fab
            mat-raised-button
            color="warn"
            (click)="drawer.toggle()"
          >
            <mat-icon>menu</mat-icon>
          </button>
          <div class="flex items-center text-white gap-2">
            <mat-icon>book</mat-icon>
            List RNCP TITLE
          </div>
        </div>
        <div class="flex gap-14 items-center">
          <div class="border border-white rounded text-white p-1">
            Need Help ?
          </div>
          <div class="flex items-center gap-2 bg-amber-400 p-2 rounded">
            <mat-icon>person</mat-icon>
            <span> DARMA Wira </span>
          </div>
        </div>
      </div>
    </div>
    <div class="w-full px-6 mb-6">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
